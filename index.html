<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐事助手个人展示站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 60px 50px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }
        h2 {
            font-size: 22px;
            color: #1677ff;
            margin-bottom: 18px;
            font-weight: 500;
        }
        p {
            font-size: 14px;
            color: #666666;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>乐事助手个人展示站</h2>
        <p>本站为个人学习作品展示网站<br>正在建设完善中，敬请期待</p>
    </div>
</body>
</html>
